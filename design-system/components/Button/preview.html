<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--surface);font-family:var(--font-body);color:var(--ink)}
.row{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-4);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);min-height:44px;padding:0 20px;border-radius:var(--radius-sm);font:500 15px/1 var(--font-body);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.ghost:hover{border-color:var(--ink)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div class="row">
<a class="btn primary" href="#">View my work
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a class="btn ghost" href="#">Download CV</a>
<button class="btn ghost" type="button">Contact</button>
</div></body></html>
