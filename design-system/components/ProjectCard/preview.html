<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);padding:var(--space-4)}
a.card{display:flex;flex-direction:column;gap:var(--space-3);max-width:360px;padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-raised);text-decoration:none;color:inherit}
a.card:hover{border-color:var(--line-strong)}
.shot{aspect-ratio:4/3;border-radius:8px;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;font:500 12px/16px var(--font-mono);color:var(--ink-muted);letter-spacing:.08em}
h3{margin:0;font:600 22px/28px var(--font-display)}
p{margin:0;font:400 15px/24px var(--font-body);color:var(--ink-muted)}
ul{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
li{font:500 12px/16px var(--font-mono);padding:5px 10px;border-radius:var(--radius-pill);background:var(--accent-soft)}
</style></head>
<body><a class="card" href="#">
<div class="shot">[APP SCREENSHOT]</div>

<p>Wine shopping app with in-app payments and push notifications.</p>
